# XcodeGen spec for the Previz Stage ARKit camera (prototype). Regenerate after editing:
#   cd ios && xcodegen generate
# Both this file and the generated PrevizCamera.xcodeproj are committed.
name: PrevizCamera
options:
  bundleIdPrefix: dev.previz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"  # Swift 5 language mode (5.10 semantics on the Swift 6 compilers)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PrevizCore:
    path: PrevizCore
targets:
  PrevizCamera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrevizCamera
    dependencies:
      - package: PrevizCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: PrevizCamera/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
schemes:
  PrevizCamera:
    build:
      targets:
        PrevizCamera: all
    run:
      config: Debug
    archive:
      config: Release
