<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Previz Stage — Director</title>
  </head>
  <body>
    <header id="topbar">
      <button
        id="drawer-toggle"
        type="button"
        class="top-icon"
        data-testid="drawer-toggle"
        aria-expanded="true"
        aria-label="Projects drawer"
        title="Show / hide the projects drawer: the project chat, every project and its scenes ( [ )"
      >
        <span data-icon="sidebar"></span>
      </button>
      <span class="brand"><span data-icon="brand"></span>Previz Stage</span>
      <span id="health" class="badge" title="Which API keys the server has">…</span>
      <span class="top-sep"></span>
      <span id="hud-title"></span>
      <span id="hud-badges"></span>
      <button
        id="top-look"
        type="button"
        class="badge look"
        data-testid="look-badge"
        hidden
        title="The scene's look (grade, lens, lights): open the Look tab"
      ></button>
      <span class="spacer"></span>
      <span id="top-clock" class="top-clock" title="Scene clock (moving props, dialogue sync)">0:00.0</span>
      <button
        id="top-play"
        type="button"
        class="top-icon"
        data-testid="top-play"
        aria-label="Play"
        title="Play / pause the scene clock (Space)"
      >
        <span data-icon="play"></span>
      </button>
      <div class="top-more">
        <button
          id="top-more"
          type="button"
          class="top-icon"
          data-testid="top-more"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-label="More"
          title="Undo, redo, keyboard and mouse"
        >
          <span data-icon="more"></span>
        </button>
        <div id="top-menu" class="menu" role="menu" hidden>
          <button id="top-undo" type="button" role="menuitem" data-testid="top-undo" title="Undo (⌘Z)">
            <span data-icon="undo"></span>Undo<kbd>⌘Z</kbd>
          </button>
          <button id="top-redo" type="button" role="menuitem" data-testid="top-redo" title="Redo (⇧⌘Z)">
            <span data-icon="redo"></span>Redo<kbd>⇧⌘Z</kbd>
          </button>
          <div class="menu-sep" role="separator"></div>
          <button
            id="top-help"
            type="button"
            role="menuitem"
            data-testid="help"
            title="Keyboard and mouse cheatsheet (?)"
          >
            <span data-icon="keyboard"></span>Keyboard &amp; mouse<kbd>?</kbd>
          </button>
        </div>
      </div>
    </header>

    <aside id="left" class="panel drawer" aria-label="Projects">
      <!-- the project chat (chat-panel.ts) docks above this list while a scene is open -->
      <section id="pp-card" class="card grow projects-card">
        <h2>Projects</h2>
        <div id="pp-list" data-testid="projects"></div>
      </section>
    </aside>

    <main id="stage">
      <canvas id="viewport" data-testid="viewport"></canvas>
      <div id="hud-top">
        <span class="spacer"></span>
        <div class="seg overlay" role="group" aria-label="View">
          <button id="hud-grid" type="button" title="Ground grid at y = 0 (G)">Grid</button>
          <button id="hud-collider" type="button" title="Collider mesh (what keeps dragged actors out of walls)">
            Collider
          </button>
          <button id="hud-pip" type="button" class="on" title="Picture-in-picture of the phone / active camera">
            PiP
          </button>
          <span class="seg-sep"></span>
          <button id="hud-reload" type="button" class="seg-icon" aria-label="Reload" title="Reload the scene">
            <span data-icon="reload"></span>
          </button>
        </div>
      </div>
      <div id="hud-empty" class="hud-center">
        <p>Open a scene from the projects drawer, or start a new project in the chat.</p>
      </div>
      <div id="hud-loading" class="hud-center small" hidden></div>
      <div id="pip-frame" hidden><span id="pip-label"></span></div>
      <div id="hud-caption" hidden data-testid="caption"></div>
      <div id="hud-rec" hidden></div>
      <div id="hud-toast" hidden data-testid="toast" role="status"></div>
    </main>

    <aside id="right" class="panel">
      <div id="pane-scene" class="pane" data-pane="scene">
        <section class="card">
          <h2>Scene</h2>
          <div id="st-scenes"></div>
        </section>
        <section class="card">
          <h2>World</h2>
          <div class="row">
            <label for="hud-quality" class="small muted">Splats</label>
            <select id="hud-quality" title="Splat resolution of the world (more = sharper, slower)">
              <option value="k100">100k</option>
              <option value="k500" selected>500k</option>
              <option value="full">full</option>
            </select>
            <span class="spacer"></span>
            <span id="st-world-kind" class="small muted"></span>
          </div>
          <div id="st-world" class="small"></div>
        </section>
        <section class="card">
          <h2>Cast</h2>
          <div id="st-cast" class="actors" data-testid="actors"></div>
        </section>
        <section class="card grow">
          <h2>Objects</h2>
          <div id="st-objects"></div>
        </section>
      </div>

      <div id="pane-shoot" class="pane" data-pane="shoot">
        <section class="card">
          <h2>Phone camera</h2>
          <div class="pair">
            <img id="ph-qr" width="176" height="176" alt="" data-testid="pair-qr" />
            <div class="pair-side">
              <div id="ph-status" class="small" data-testid="phone-status"></div>
              <input id="ph-url" class="small" spellcheck="false" title="Phone URL (editable)" />
              <div id="ph-hint" class="warn small"></div>
              <div class="row wrap">
                <button
                  id="ph-recenter"
                  type="button"
                  data-testid="recenter"
                  title="The phone's current heading becomes the attached camera's heading"
                >
                  Re-center phone
                </button>
                <button
                  id="ph-view"
                  type="button"
                  data-testid="view-from-phone"
                  title="View through the phone (V); the PiP then shows the director view"
                >
                  View: director
                </button>
                <button id="ph-new" type="button" title="New room code (re-pair the phone)">New room</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Scene clock</h2>
          <div class="row">
            <button id="sc-play" type="button" data-testid="play" title="Play / pause the scene clock (Space)">Play</button>
            <button id="sc-reset" type="button" class="icon" aria-label="Back to 0:00" title="Back to 0:00">
              <span data-icon="skip-back"></span>
            </button>
            <span id="sc-clock" class="clock" data-testid="clock">0:00.0</span>
          </div>
        </section>

        <section class="card">
          <h2>Take</h2>
          <div class="row">
            <button
              id="hud-record"
              type="button"
              data-testid="record"
              title="Record the view plus the dialogue audio as WebM (R)"
            >
              Record take
            </button>
            <button id="hud-still" type="button" title="Save a still (PNG) from the phone camera">Still</button>
          </div>
        </section>

        <section class="card">
          <h2>Cameras</h2>
          <div class="row">
            <input id="cam-name" placeholder="Name (optional)" title="Name for the next camera" />
            <button
              id="cam-drop"
              type="button"
              class="primary"
              data-testid="drop-camera"
              title="Drop a camera at the current view (C)"
            >
              Drop
            </button>
          </div>
          <div id="cam-list"></div>
        </section>

        <section class="card">
          <h2>Suggested shots</h2>
          <div id="shot-list"></div>
        </section>

        <section class="card grow">
          <h2>
            Dialogue
            <span class="spacer"></span>
            <button
              id="sc-playall"
              type="button"
              class="small"
              data-testid="play-all"
              title="Play every line in order (also starts the scene clock)"
            >
              Play scene
            </button>
            <button id="sc-stop" type="button" class="small" title="Stop the dialogue">Stop</button>
          </h2>
          <div id="line-list"></div>
        </section>
      </div>
    </aside>

    <script type="module" src="/src/laptop/main.ts"></script>
  </body>
</html>
