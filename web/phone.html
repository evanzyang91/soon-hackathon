<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Previz Camera</title>
    <script>
      // ?pose=external (native ARKit app): hide the start screen before it can render
      if (new URLSearchParams(location.search).get('pose') === 'external')
        document.documentElement.dataset.pose = 'external';
    </script>
    <link rel="icon" href="data:," />
    <style>
      /* the laptop's tokens (web/src/laptop/style.css), plus the glass the HUD sits on */
      :root {
        --bg: #0c0d0f;
        --surface-1: #131417;
        --surface-2: #1b1d21;
        --text: #e4e5e8;
        --muted: #8b8f98;
        --hairline: rgba(255, 255, 255, 0.08);
        --track: rgba(255, 255, 255, 0.14);
        --hover: rgba(255, 255, 255, 0.05);
        --accent: #5a7bf0;
        --on-accent: #ffffff;
        --ok: #6fae8c;
        --warn: #c9a45c;
        --bad: #d06a6a;
        --scrim: rgba(12, 13, 15, 0.72);
        --glass: rgba(12, 13, 15, 0.5);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        --radius: 6px;
        --font: -apple-system, system-ui, 'Inter', sans-serif;
        --fs: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --fs-lg: 20px;
        --gutter: max(12px, env(safe-area-inset-left));
        --gutter-r: max(12px, env(safe-area-inset-right));
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--text);
        font: 400 var(--fs) / 1.4 var(--font);
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      #vf {
        display: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }

      /* ---- start screen ---- */
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px var(--gutter-r) 24px var(--gutter);
        background: var(--bg);
        z-index: 10;
      }
      .card {
        width: min(360px, 100%);
        text-align: center;
      }
      .card .mark {
        width: 20px;
        height: 20px;
        margin-bottom: 12px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: var(--fs-lg);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .card p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      #room-input {
        width: 100%;
        height: 56px;
        padding: 0 16px;
        margin-bottom: 12px;
        border: none;
        border-radius: var(--radius);
        outline: none;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--hairline);
        color: var(--text);
        font: 600 var(--fs-lg) / 1 var(--font);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.3em;
        /* the tracking trails the last letter: shift the code back to the centre */
        text-indent: 0.3em;
        text-align: center;
        text-transform: uppercase;
        user-select: text;
        -webkit-user-select: text;
      }
      #room-input:focus {
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      #room-input::placeholder {
        color: var(--muted);
      }
      #start-button {
        width: 100%;
        height: 48px;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      #start-button:active {
        transform: scale(0.98);
      }
      #start-error {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: var(--warn);
      }
      .fine {
        margin-top: 16px !important;
        font-size: var(--fs-sm);
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--radius);
        background: var(--glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      #top-left {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: var(--gutter);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 45vw;
      }
      #room {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.12em;
      }
      #conn {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warn);
      }
      #conn[data-state='open'] {
        background: var(--ok);
      }
      #conn[data-state='closed'] {
        background: var(--bad);
      }
      #conn[data-state='reconnecting'] {
        animation: blink 0.8s steps(2) infinite;
      }
      #conn-label,
      #peers {
        color: var(--muted);
      }
      #peers[data-ok='true'] {
        color: var(--text);
      }
      #top-center {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      #cam-name {
        font-weight: 600;
      }
      #lens,
      #clock {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      #clock[data-playing='true'] {
        color: var(--ok);
      }
      #perf {
        position: absolute;
        right: var(--gutter-r);
        bottom: max(6px, env(safe-area-inset-bottom));
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        text-shadow: 0 1px 2px #000;
      }
      #rec-badge {
        gap: 6px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--bad);
      }
      #rec-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--bad);
        animation: blink 1s steps(2) infinite;
      }
      /* ---- ACTION / CUT + next line (top right) ---- */
      #top-right {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: var(--gutter-r);
        display: flex;
        gap: 6px;
        align-items: center;
        pointer-events: auto;
      }
      #action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 96px;
        height: 40px;
        padding: 0 14px;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      /* a play triangle; a stop square while the scene runs */
      #action::before {
        content: '';
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5px 0 5px 8px;
        border-color: transparent transparent transparent currentColor;
      }
      #action[aria-pressed='true'] {
        background: var(--bad);
      }
      #action[aria-pressed='true']::before {
        width: 9px;
        height: 9px;
        border: none;
        border-radius: 1.5px;
        background: currentColor;
      }
      #action:active,
      #next-line:active,
      .small:active {
        transform: scale(0.96);
      }
      #controls {
        position: absolute;
        right: var(--gutter-r);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: auto;
      }
      .small {
        min-width: 64px;
        height: 40px;
        padding: 0 12px;
        border-radius: var(--radius);
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--hairline);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: var(--fs-sm);
        font-weight: 600;
      }
      #shutter {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--text);
        box-shadow:
          0 0 0 4px rgba(0, 0, 0, 0.35),
          0 0 0 6px var(--text);
      }
      #shutter:active {
        transform: scale(0.92);
      }
      #record {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--text);
        display: grid;
        place-items: center;
      }
      #record::after {
        content: '';
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--bad);
        transition:
          border-radius 0.15s,
          width 0.15s,
          height 0.15s;
      }
      #record[aria-pressed='true']::after {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        /* leave the joystick (left) and the height slider + controls (right) uncovered */
        max-width: max(40vw, min(calc(100vw - 420px), 720px));
        padding: 8px 12px;
        border-radius: var(--radius);
        background: var(--scrim);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-weight: 500;
        text-align: center;
        text-wrap: balance;
      }
      #bottom-left {
        position: absolute;
        left: var(--gutter);
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 178px);
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      #attitude {
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        text-shadow: 0 1px 2px #000;
      }
      body[data-view='viewfinder'] #attitude {
        display: none; /* the viewfinder draws the same numbers large */
      }
      #hint:empty {
        display: none;
      }
      /* ---- walk: left-thumb joystick + height slider ---- */
      #joystick {
        position: absolute;
        left: var(--gutter);
        bottom: max(10px, env(safe-area-inset-bottom));
        width: 172px;
        height: 172px;
        pointer-events: auto;
        touch-action: none;
      }
      #joy-base {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px var(--track);
        background: var(--glass);
        transition: box-shadow 0.15s;
      }
      #joystick[data-active] #joy-base {
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      #joy-knob,
      #height-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: var(--text);
        opacity: 0.8;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      }
      #joy-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;
        text-align: center;
        font-size: var(--fs-xs);
        color: var(--muted);
        text-shadow: 0 1px 2px #000;
      }
      #height {
        position: absolute;
        right: calc(var(--gutter-r) + 96px);
        top: 50%;
        width: 40px;
        height: 156px;
        margin-top: -78px;
        border-radius: 20px;
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--hairline);
        pointer-events: auto;
        touch-action: none;
      }
      /* up / down chevrons, 1.5 px */
      #height::before,
      #height::after {
        content: '';
        position: absolute;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-left: 1.5px solid var(--muted);
        border-top: 1.5px solid var(--muted);
      }
      #height::before {
        top: 12px;
        transform: rotate(45deg);
      }
      #height::after {
        bottom: 12px;
        transform: rotate(-135deg);
      }
      #height-knob {
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
      }
      #height[data-active] {
        box-shadow: inset 0 0 0 1px var(--muted);
      }
      #walk-readout:empty,
      #wall:empty {
        display: none;
      }
      /* pose=external + a room scan: near a real wall / outside the scanned room */
      #wall {
        border-color: #36d6e7;
      }
      body[data-wall='near'] #wall,
      body[data-wall='outside'] #wall {
        border-color: #ff4040;
        background: rgba(120, 0, 0, 0.65);
      }
      body[data-wall='near'] #stage,
      body[data-wall='outside'] #stage {
        box-shadow: inset 0 0 0 6px rgba(255, 64, 64, 0.7);
      }
      #toast {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        border-radius: var(--radius);
        background: var(--scrim);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-weight: 500;
        text-align: center;
        /* centred with left 50 %: without max-content it would wrap at half the screen width */
        width: max-content;
        max-width: 80vw;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
      #flash.go {
        animation: flash 0.35s ease-out;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) {
        #rotate {
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, 60px);
          color: var(--muted);
          font-size: var(--fs-sm);
        }
        #controls {
          top: auto;
          bottom: max(16px, env(safe-area-inset-bottom));
          right: 50%;
          transform: translateX(50%);
          flex-direction: row;
        }
        #caption {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
          max-width: 90vw;
        }
        #bottom-left {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 280px);
        }
        #joystick {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
        }
        #height {
          right: var(--gutter-r);
        }
        #perf {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px);
        }
      }
      /* ---- ?pose=external: the native app (ios/) draws its own controls over the page; the inline
         script in <head> marks <html> before the body renders, so the start screen never flashes ---- */
      [data-pose='external'] #start,
      [data-pose='external'] #joystick,
      [data-pose='external'] #height,
      [data-pose='external'] #controls,
      [data-pose='external'] #top-right,
      [data-pose='external'] #top-left,
      [data-pose='external'] #walk-readout,
      [data-pose='external'] #hint,
      [data-pose='external'] #rotate {
        display: none;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      @keyframes flash {
        from {
          opacity: 0.9;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body data-view="viewfinder">
    <canvas id="gl"></canvas>
    <canvas id="vf"></canvas>
    <div id="stage"></div>

    <div id="hud" hidden>
      <div id="top-left">
        <span class="pill"
          ><span id="conn" data-state="idle"></span><span id="room">----</span></span
        >
        <span class="pill"
          ><span id="conn-label">offline</span> · <span id="peers">waiting for director</span></span
        >
      </div>
      <div id="top-center">
        <span class="pill"
          ><span id="cam-name">No camera</span><span id="lens">--mm</span
          ><span id="clock" hidden title="Scene clock (the laptop plays / pauses it)">⏸ 0:00</span></span
        >
        <span class="pill" id="rec-badge" hidden><span id="rec-time">00:00</span></span>
      </div>
      <div id="top-right">
        <button id="action" type="button" aria-pressed="false" title="Laptop: play the scene (dialogue in order + clock)">ACTION</button>
        <button id="next-line" class="small" type="button" title="Laptop: play the next dialogue line">Line ›</button>
      </div>
      <div id="controls">
        <button id="recenter" class="small" type="button">Recenter</button>
        <button id="shutter" type="button" aria-label="Shutter"></button>
        <button id="record" type="button" aria-label="Record" aria-pressed="false"></button>
        <button id="next-cam" class="small" type="button">Cam ›</button>
      </div>
      <div id="bottom-left">
        <span id="hint" class="pill"></span>
        <span id="walk-readout" class="pill"></span>
        <span id="wall" class="pill"></span>
        <span id="attitude"></span>
      </div>
      <div id="joystick" aria-label="Walk: drag to move, double-tap to return to the camera">
        <div id="joy-base"><div id="joy-knob"></div></div>
        <span id="joy-label">walk · 2× tap = back</span>
      </div>
      <div id="height" aria-label="Height: drag up or down">
        <div id="height-knob"></div>
      </div>
      <div id="caption" hidden></div>
      <div id="perf" title="3D frames per second · render quality (the governor lowers it when the phone is too slow)"></div>
      <div id="toast" hidden></div>
      <div id="rotate">Rotate to landscape for the widest frame</div>
    </div>
    <div id="flash"></div>

    <div id="start">
      <div class="card">
        <!-- the brand mark (web/src/laptop/icons.ts 'brand') -->
        <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3" />
          <circle cx="8" cy="8" r="1.75" />
        </svg>
        <h1>Previz Camera</h1>
        <p>Your phone becomes the handheld camera for the scene on the laptop.</p>
        <input
          id="room-input"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          maxlength="6"
          placeholder="ROOM"
          aria-label="Room code"
        />
        <button id="start-button" type="button">Tap to start</button>
        <p id="start-error" role="alert"></p>
        <p class="fine">Allow motion access when asked, then hold the phone in landscape.</p>
      </div>
    </div>

    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
