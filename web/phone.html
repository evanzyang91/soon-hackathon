<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Previz Camera</title>
    <script>
      // ?pose=external (native ARKit app): hide the start screen before it can render
      if (new URLSearchParams(location.search).get('pose') === 'external')
        document.documentElement.dataset.pose = 'external';
    </script>
    <link rel="icon" href="data:," />
    <style>
      /* the laptop's tokens (web/src/laptop/style.css), plus the glass the HUD sits on */
      :root {
        --bg: #0c0d0f;
        --surface-1: #131417;
        --surface-2: #1b1d21;
        --text: #e4e5e8;
        --muted: #8b8f98;
        --hairline: rgba(255, 255, 255, 0.08);
        --track: rgba(255, 255, 255, 0.14);
        --hover: rgba(255, 255, 255, 0.05);
        --accent: #5a7bf0;
        --on-accent: #ffffff;
        --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
        --ok: #6fae8c;
        --warn: #c9a45c;
        --bad: #d06a6a;
        --scrim: rgba(12, 13, 15, 0.72);
        --glass: rgba(12, 13, 15, 0.5);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        --radius: 6px;
        --font: -apple-system, system-ui, 'Inter', sans-serif;
        --fs: 13px;
        --fs-sm: 12px;
        --fs-xs: 11px;
        --fs-lg: 20px;
        --gutter: max(12px, env(safe-area-inset-left));
        --gutter-r: max(12px, env(safe-area-inset-right));
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--text);
        font: 400 var(--fs) / 1.4 var(--font);
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      #vf {
        display: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }

      /* ---- start screen ---- */
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px var(--gutter-r) 24px var(--gutter);
        background: var(--bg);
        z-index: 10;
      }
      .card {
        width: min(360px, 100%);
        text-align: center;
      }
      .card .mark {
        width: 20px;
        height: 20px;
        margin-bottom: 12px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: var(--fs-lg);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .card p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      #room-input {
        width: 100%;
        height: 56px;
        padding: 0 16px;
        margin-bottom: 12px;
        border: none;
        border-radius: var(--radius);
        outline: none;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--hairline);
        color: var(--text);
        font: 600 var(--fs-lg) / 1 var(--font);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.3em;
        /* the tracking trails the last letter: shift the code back to the centre */
        text-indent: 0.3em;
        text-align: center;
        text-transform: uppercase;
        user-select: text;
        -webkit-user-select: text;
      }
      #room-input:focus {
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      #room-input::placeholder {
        color: var(--muted);
      }
      #start-button {
        width: 100%;
        height: 48px;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      #start-button:active {
        transform: scale(0.98);
      }
      #start-error {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: var(--warn);
      }
      .fine {
        margin-top: 16px !important;
        font-size: var(--fs-sm);
      }

      /* ---- HUD: the frame first. One quiet label, a dot, the camera controls on the right
         edge, the walk controls on the left; everything small and translucent ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--radius);
        background: var(--glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: var(--fs-sm);
        white-space: nowrap;
      }
      /* round glass icon buttons (44 px touch targets) */
      .glass {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--hairline);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--text);
        pointer-events: auto;
        -webkit-touch-callout: none;
      }
      .glass:active {
        transform: scale(0.94);
      }
      .glass svg,
      .cam-menu svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #top {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        max-width: calc(100vw - 2 * 64px);
      }
      #cam-label {
        min-width: 0;
        color: var(--text);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        /* swipe sideways for the next / previous shot */
        pointer-events: auto;
        touch-action: none;
      }
      #cam-name {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #conn {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warn);
      }
      #conn[data-level='ok'] {
        background: var(--ok);
      }
      #conn[data-level='bad'] {
        background: var(--bad);
      }
      #conn[data-state='reconnecting'] {
        animation: blink 0.8s steps(2) infinite;
      }
      #rec-badge {
        gap: 6px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--bad);
      }
      #rec-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--bad);
        animation: blink 1s steps(2) infinite;
      }
      #perf {
        position: absolute;
        right: var(--gutter-r);
        bottom: max(6px, env(safe-area-inset-bottom));
        font-size: var(--fs-xs);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        text-shadow: 0 1px 2px #000;
      }
      /* play / pause the scene on the laptop (hold: the next line) */
      #play {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: var(--gutter-r);
      }
      #play .i-pause,
      #play[aria-pressed='true'] .i-play {
        display: none;
      }
      #play[aria-pressed='true'] .i-pause {
        display: block;
      }
      #play svg path {
        stroke-width: 1.75;
      }
      #play .i-play path {
        fill: currentColor;
      }
      #controls {
        position: absolute;
        right: var(--gutter-r);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }
      #recenter svg {
        width: 18px;
        height: 18px;
      }
      #cam[aria-expanded='true'] {
        background: var(--text);
        color: var(--bg);
      }
      #shutter {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--text);
        box-shadow:
          0 0 0 4px rgba(0, 0, 0, 0.35),
          0 0 0 6px var(--text);
      }
      #shutter:active {
        transform: scale(0.92);
      }
      #record {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--text);
        display: grid;
        place-items: center;
      }
      #record::after {
        content: '';
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--bad);
        transition:
          border-radius 0.15s,
          width 0.15s,
          height 0.15s;
      }
      #record[aria-pressed='true']::after {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }
      /* ---- the camera popover: the scene's shots, Handheld, Add shot from here ---- */
      .cam-menu {
        position: absolute;
        display: flex;
        flex-direction: column;
        width: min(280px, calc(100vw - 32px));
        padding: 4px;
        border-radius: 10px;
        background: var(--scrim);
        box-shadow: var(--shadow), inset 0 0 0 1px var(--hairline);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        pointer-events: auto;
        z-index: 7;
      }
      .cam-shots {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }
      .cam-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 0 10px;
        border-radius: var(--radius);
        background: transparent;
        text-align: left;
        font-size: var(--fs);
        -webkit-touch-callout: none;
      }
      .cam-menu button:active {
        background: var(--hover);
      }
      .cam-menu button[aria-checked='true'] {
        background: var(--accent-soft);
      }
      .cam-menu .num {
        flex: none;
        min-width: 26px;
        color: var(--muted);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .cam-menu [aria-checked='true'] .num {
        color: var(--accent);
      }
      .cam-menu .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cam-menu .lens {
        flex: none;
        color: var(--muted);
        font-size: var(--fs-sm);
        font-variant-numeric: tabular-nums;
      }
      .cam-menu .sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--hairline);
      }
      .cam-menu .num svg {
        display: block;
        width: 16px;
        height: 16px;
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        /* leave the joystick (left) and the height slider + controls (right) uncovered */
        max-width: max(40vw, min(calc(100vw - 420px), 720px));
        padding: 8px 12px;
        border-radius: var(--radius);
        background: var(--scrim);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-weight: 500;
        text-align: center;
        text-wrap: balance;
      }
      /* ---- walk: left-thumb joystick + height slider ---- */
      #joystick {
        position: absolute;
        left: var(--gutter);
        bottom: max(10px, env(safe-area-inset-bottom));
        width: 172px;
        height: 172px;
        pointer-events: auto;
        touch-action: none;
      }
      #joy-base {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px var(--track);
        background: var(--glass);
        transition: box-shadow 0.15s;
      }
      #joystick[data-active] #joy-base {
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      #joy-knob,
      #height-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: var(--text);
        opacity: 0.7;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      }
      #height {
        position: absolute;
        right: calc(var(--gutter-r) + 88px);
        top: 50%;
        width: 44px;
        height: 156px;
        margin-top: -78px;
        border-radius: 22px;
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--hairline);
        pointer-events: auto;
        touch-action: none;
      }
      /* up / down chevrons, 1.5 px */
      #height::before,
      #height::after {
        content: '';
        position: absolute;
        left: 50%;
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-left: 1.5px solid var(--muted);
        border-top: 1.5px solid var(--muted);
      }
      #height::before {
        top: 12px;
        transform: rotate(45deg);
      }
      #height::after {
        bottom: 12px;
        transform: rotate(-135deg);
      }
      #height-knob {
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
      }
      #height[data-active] {
        box-shadow: inset 0 0 0 1px var(--muted);
      }
      /* under the label, clear of the subject in the middle of the frame */
      #toast {
        position: absolute;
        top: calc(max(10px, env(safe-area-inset-top)) + 40px);
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: var(--radius);
        background: var(--scrim);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: var(--fs-sm);
        font-weight: 500;
        text-align: center;
        /* centred with left 50 %: without max-content it would wrap at half the screen width */
        width: max-content;
        max-width: 80vw;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
      #flash.go {
        animation: flash 0.35s ease-out;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) {
        #rotate {
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, 60px);
          color: var(--muted);
          font-size: var(--fs-sm);
          white-space: nowrap;
        }
        #controls {
          top: auto;
          bottom: max(16px, env(safe-area-inset-bottom));
          right: 50%;
          transform: translateX(50%);
          flex-direction: row;
          gap: 16px;
        }
        #caption {
          /* above the joystick (in portrait it sits on the row of controls) */
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 276px);
          max-width: 90vw;
        }
        #joystick {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
        }
        #height {
          right: var(--gutter-r);
        }
        #perf {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px);
        }
      }
      /* ---- ?pose=external: the native app (ios/) draws its own controls over the page; the inline
         script in <head> marks <html> before the body renders, so the start screen never flashes ---- */
      [data-pose='external'] #start,
      [data-pose='external'] #joystick,
      [data-pose='external'] #height,
      [data-pose='external'] #controls,
      [data-pose='external'] #play,
      [data-pose='external'] #cam-menu,
      [data-pose='external'] #conn,
      [data-pose='external'] #rotate {
        display: none;
      }
      [data-pose='external'] #cam-label {
        pointer-events: none;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      @keyframes flash {
        from {
          opacity: 0.9;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body data-view="viewfinder">
    <canvas id="gl"></canvas>
    <canvas id="vf"></canvas>
    <div id="stage"></div>

    <div id="hud" hidden>
      <div id="top">
        <span id="cam-label" class="pill" title="The shot the phone is on · swipe for the next one"
          ><span id="conn" data-state="idle" data-level="wait" role="img" aria-label="Offline"></span
          ><span id="cam-name">Handheld</span></span
        >
        <span class="pill" id="rec-badge" hidden><span id="rec-time">00:00</span></span>
      </div>
      <button
        id="play"
        class="glass"
        type="button"
        aria-pressed="false"
        aria-label="Play the scene"
        title="Play the scene on the laptop (lines in order + clock); hold for the next line"
      >
        <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5 3.4v9.2a.4.4 0 0 0 .6.34l7.2-4.6a.4.4 0 0 0 0-.68L5.6 3.06a.4.4 0 0 0-.6.34Z" />
        </svg>
        <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.5 3.5v9M10.5 3.5v9" />
        </svg>
      </button>
      <div id="controls">
        <button
          id="recenter"
          class="glass"
          type="button"
          aria-label="Recenter"
          title="Recenter: where the phone points now becomes the shot's heading"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="4.25" />
            <path d="M8 1.5v2.25M8 12.25v2.25M1.5 8h2.25M12.25 8h2.25" />
          </svg>
        </button>
        <button id="shutter" type="button" aria-label="Shutter" title="Save a frame on the laptop"></button>
        <button
          id="record"
          type="button"
          aria-label="Record"
          aria-pressed="false"
          title="Record a take on the laptop"
        ></button>
        <button
          id="cam"
          class="glass"
          type="button"
          aria-label="Cameras"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="cam-menu"
          title="Switch to another shot, go handheld, or add a shot from here"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.75" y="4.25" width="9" height="7.5" rx="1.5" />
            <path d="m10.75 7 3.5-2v6l-3.5-2" />
          </svg>
        </button>
      </div>
      <div id="cam-menu" class="cam-menu" role="menu" aria-label="Cameras" hidden></div>
      <div id="joystick" aria-label="Walk: drag to move, double-tap to return to the shot">
        <div id="joy-base"><div id="joy-knob"></div></div>
      </div>
      <div id="height" aria-label="Height: drag up or down">
        <div id="height-knob"></div>
      </div>
      <div id="caption" hidden></div>
      <div id="perf" hidden title="3D frames per second · render quality (?perf=1)"></div>
      <div id="toast" role="status" hidden></div>
      <div id="rotate">Rotate to landscape for the widest frame</div>
    </div>
    <div id="flash"></div>

    <div id="start">
      <div class="card">
        <!-- the brand mark (web/src/laptop/icons.ts 'brand') -->
        <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3" />
          <circle cx="8" cy="8" r="1.75" />
        </svg>
        <h1>Previz Camera</h1>
        <p>Your phone becomes the handheld camera for the scene on the laptop.</p>
        <input
          id="room-input"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          maxlength="6"
          placeholder="ROOM"
          aria-label="Room code"
        />
        <button id="start-button" type="button">Tap to start</button>
        <p id="start-error" role="alert"></p>
        <p class="fine">Allow motion access when asked, then hold the phone in landscape.</p>
      </div>
    </div>

    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
