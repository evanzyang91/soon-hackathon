<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Previz Camera</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --fg: #f4f4f2;
        --dim: rgba(244, 244, 242, 0.62);
        --glass: rgba(12, 14, 18, 0.48);
        --line: rgba(255, 255, 255, 0.14);
        --rec: #ff3b30;
        --ok: #34c759;
        --warn: #ffcc00;
        --accent: #ffcf5a;
        --gutter: max(12px, env(safe-area-inset-left));
        --gutter-r: max(12px, env(safe-area-inset-right));
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--fg);
        font:
          14px/1.35 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      #vf {
        display: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }

      /* ---- start screen ---- */
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px var(--gutter-r) 24px var(--gutter);
        background: radial-gradient(120% 90% at 50% 0%, #1d2633 0%, #07090c 70%);
        z-index: 10;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .card p {
        margin: 0 0 18px;
        color: var(--dim);
      }
      #room-input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font:
          600 26px/1 ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.3em;
        text-align: center;
        text-transform: uppercase;
        user-select: text;
        -webkit-user-select: text;
      }
      #start-button {
        width: 100%;
        min-height: 56px;
        border-radius: 14px;
        background: var(--fg);
        color: #000;
        font-size: 18px;
        font-weight: 650;
      }
      #start-button:active {
        transform: scale(0.98);
      }
      #start-error {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: var(--warn);
      }
      .fine {
        margin-top: 14px !important;
        font-size: 12px;
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 12px;
        white-space: nowrap;
      }
      #top-left {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: var(--gutter);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 45vw;
      }
      #room {
        font:
          600 13px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
      }
      #conn {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
      }
      #conn[data-state='open'] {
        background: var(--ok);
      }
      #conn[data-state='closed'] {
        background: var(--rec);
      }
      #conn[data-state='reconnecting'] {
        animation: blink 0.8s steps(2) infinite;
      }
      #peers {
        color: var(--dim);
      }
      #peers[data-ok='true'] {
        color: var(--fg);
      }
      #top-center {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      #cam-name {
        font-weight: 600;
      }
      #lens {
        font:
          600 12px ui-monospace,
          Menlo,
          monospace;
        color: var(--accent);
      }
      #rec-badge {
        color: var(--rec);
        font:
          600 12px ui-monospace,
          Menlo,
          monospace;
      }
      #rec-badge::before {
        content: '●';
        margin-right: 4px;
        animation: blink 1s steps(2) infinite;
      }
      /* ---- ACTION / CUT + next line (top right) ---- */
      #top-right {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: var(--gutter-r);
        display: flex;
        gap: 6px;
        align-items: center;
        pointer-events: auto;
      }
      #action {
        min-width: 92px;
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 12px;
        background: #1f8f4e;
        color: #fff;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.08em;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
      }
      #action::before {
        content: '▶ ';
      }
      #action[aria-pressed='true'] {
        background: var(--rec);
      }
      #action[aria-pressed='true']::before {
        content: '■ ';
      }
      #action:active,
      #next-line:active {
        transform: scale(0.96);
      }
      #controls {
        position: absolute;
        right: var(--gutter-r);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        pointer-events: auto;
      }
      .small {
        min-width: 64px;
        min-height: 40px;
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 12px;
        font-weight: 600;
      }
      #shutter {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--fg);
        box-shadow:
          0 0 0 4px rgba(0, 0, 0, 0.35),
          0 0 0 7px var(--fg);
      }
      #shutter:active {
        transform: scale(0.92);
      }
      #record {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: transparent;
        box-shadow: inset 0 0 0 3px var(--fg);
        display: grid;
        place-items: center;
      }
      #record::after {
        content: '';
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--rec);
        transition:
          border-radius 0.15s,
          width 0.15s,
          height 0.15s;
      }
      #record[aria-pressed='true']::after {
        width: 20px;
        height: 20px;
        border-radius: 5px;
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        /* leave the joystick (left) and the height slider + controls (right) uncovered */
        max-width: max(40vw, min(calc(100vw - 420px), 720px));
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.6);
        font-size: 15px;
        text-align: center;
        text-wrap: balance;
      }
      #bottom-left {
        position: absolute;
        left: var(--gutter);
        bottom: calc(max(10px, env(safe-area-inset-bottom)) + 178px);
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }
      #attitude {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: var(--dim);
        text-shadow: 0 1px 2px #000;
      }
      body[data-view='viewfinder'] #attitude {
        display: none; /* the viewfinder draws the same numbers large */
      }
      #hint:empty {
        display: none;
      }
      /* ---- walk: left-thumb joystick + height slider ---- */
      #joystick {
        position: absolute;
        left: var(--gutter);
        bottom: max(10px, env(safe-area-inset-bottom));
        width: 172px;
        height: 172px;
        pointer-events: auto;
        touch-action: none;
      }
      #joy-base {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.32);
        background: rgba(12, 14, 18, 0.22);
        transition: border-color 0.15s;
      }
      #joystick[data-active] #joy-base {
        border-color: rgba(255, 255, 255, 0.65);
      }
      #joy-knob,
      #height-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(244, 244, 242, 0.72);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      }
      #joy-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;
        text-align: center;
        font-size: 10px;
        color: var(--dim);
        text-shadow: 0 1px 2px #000;
      }
      #height {
        position: absolute;
        right: calc(var(--gutter-r) + 96px);
        top: 50%;
        width: 40px;
        height: 156px;
        margin-top: -78px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--line);
        pointer-events: auto;
        touch-action: none;
      }
      #height::before,
      #height::after {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        color: var(--dim);
      }
      #height::before {
        content: '▲';
        top: 6px;
      }
      #height::after {
        content: '▼';
        bottom: 6px;
      }
      #height-knob {
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
      }
      #height[data-active] {
        border-color: rgba(255, 255, 255, 0.5);
      }
      #walk-readout:empty {
        display: none;
      }
      #toast {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.72);
        font-weight: 600;
        text-align: center;
        max-width: 80vw;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
      #flash.go {
        animation: flash 0.35s ease-out;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) {
        #rotate {
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, 60px);
          color: var(--dim);
          font-size: 12px;
        }
        #controls {
          top: auto;
          bottom: max(16px, env(safe-area-inset-bottom));
          right: 50%;
          transform: translateX(50%);
          flex-direction: row;
        }
        #caption {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
          max-width: 90vw;
        }
        #bottom-left {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 280px);
        }
        #joystick {
          bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
        }
        #height {
          right: var(--gutter-r);
        }
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      @keyframes flash {
        from {
          opacity: 0.9;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body data-view="viewfinder">
    <canvas id="gl"></canvas>
    <canvas id="vf"></canvas>
    <div id="stage"></div>

    <div id="hud" hidden>
      <div id="top-left">
        <span class="pill"
          ><span id="conn" data-state="idle"></span><span id="room">----</span></span
        >
        <span class="pill"
          ><span id="conn-label">offline</span> · <span id="peers">waiting for director</span></span
        >
      </div>
      <div id="top-center">
        <span class="pill"><span id="cam-name">No camera</span><span id="lens">--mm</span></span>
        <span class="pill" id="rec-badge" hidden><span id="rec-time">00:00</span></span>
      </div>
      <div id="top-right">
        <button id="action" type="button" aria-pressed="false" title="Laptop: play the scene (dialogue in order + clock)">ACTION</button>
        <button id="next-line" class="small" type="button" title="Laptop: play the next dialogue line">Line ›</button>
      </div>
      <div id="controls">
        <button id="recenter" class="small" type="button">Recenter</button>
        <button id="shutter" type="button" aria-label="Shutter"></button>
        <button id="record" type="button" aria-label="Record" aria-pressed="false"></button>
        <button id="next-cam" class="small" type="button">Cam ›</button>
      </div>
      <div id="bottom-left">
        <span id="hint" class="pill"></span>
        <span id="walk-readout" class="pill"></span>
        <span id="attitude"></span>
      </div>
      <div id="joystick" aria-label="Walk: drag to move, double-tap to return to the camera">
        <div id="joy-base"><div id="joy-knob"></div></div>
        <span id="joy-label">walk · 2× tap = back</span>
      </div>
      <div id="height" aria-label="Height: drag up or down">
        <div id="height-knob"></div>
      </div>
      <div id="caption" hidden></div>
      <div id="toast" hidden></div>
      <div id="rotate">Rotate to landscape for the widest frame</div>
    </div>
    <div id="flash"></div>

    <div id="start">
      <div class="card">
        <h1>Previz Camera</h1>
        <p>Your phone becomes the handheld camera for the scene on the laptop.</p>
        <input
          id="room-input"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          maxlength="6"
          placeholder="ROOM"
          aria-label="Room code"
        />
        <button id="start-button" type="button">Tap to start</button>
        <p id="start-error" role="alert"></p>
        <p class="fine">Allow motion access when asked, then hold the phone in landscape.</p>
      </div>
    </div>

    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
